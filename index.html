<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlushRush">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>FlushRush</title>
<style>
:root{--panel:rgba(18,21,29,.86);--line:rgba(255,255,255,.1);--tx:#f3f4f7;--mut:#9aa1b2;--acc:#ff7a1a;--acc2:#2ec4b6;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14161c;overflow:hidden;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hidden{display:none!important}
svg{display:block}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .tl{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
#score{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.chip{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px 4px;font-weight:800;font-size:14px;position:relative;overflow:hidden;min-width:40px;text-align:center}
#multBar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0;transition:width .2s}
#mult.hot{color:var(--gold)}
#dist{font-size:12px;font-weight:700;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#hud .tr{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#lives{display:flex;gap:3px}
#lives svg{width:20px;height:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));transition:transform .2s}
#lives svg.lost{opacity:.35}
.ibtns{display:flex;gap:8px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:13px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.45}
#boost{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffb067,#ff7a1a 55%,#d9530a);box-shadow:0 8px 22px rgba(255,122,26,.45),inset 0 -4px 0 rgba(0,0,0,.18);transition:filter .2s,transform .1s}
#boost:active{transform:scale(.94)}
#boost.empty{filter:grayscale(1) brightness(.75);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#boost.on{background:radial-gradient(circle at 35% 30%,#b8f6ff,#3ccfff 55%,#1a8fd9);box-shadow:0 0 30px rgba(60,207,255,.8)}
#boost svg{width:38px;height:38px}
#boostRing{position:absolute;inset:-6px;border-radius:50%;pointer-events:none}
#pips{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#pips i{width:11px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);box-shadow:0 1px 3px rgba(0,0,0,.4)}
#pips i.f{background:#7ef0ff;box-shadow:0 0 6px #4fd8ff}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.55);white-space:nowrap;letter-spacing:.5px}
#toast.show{animation:toast 1.2s ease-out}
#toast small{display:block;font-size:14px;font-weight:700;text-align:center;opacity:.85;margin-top:2px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#hint{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;transition:opacity .5s;display:flex;align-items:center;gap:8px}
#hint.gone{opacity:0}
/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));background:linear-gradient(rgba(10,12,18,.15),rgba(10,12,18,.5))}
.panel{width:100%;max-width:540px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:18px 18px 20px;touch-action:pan-y;box-shadow:0 20px 60px rgba(0,0,0,.45);scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel>div{min-width:0}
h1{margin:0;font-size:36px;font-weight:900;letter-spacing:1px;line-height:1.05}
h1 span{background:linear-gradient(90deg,#ffb067,#ff5e1a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:4px 0 4px;font-size:14px}
h3{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);font-weight:800}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none;touch-action:pan-x pan-y}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:84px;border-radius:15px;background:rgba(255,255,255,.05);border:2px solid transparent;padding:7px 4px 6px;text-align:center;font-size:12px;font-weight:700;transition:background .15s,border-color .15s}
.card.sel{border-color:var(--acc);background:rgba(255,122,26,.14)}
.card canvas{display:block;margin:0 auto 5px;border-radius:9px}
.stats{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.stats .desc{grid-column:1/3;color:#d9dce4;font-weight:600;font-size:13px;margin-bottom:2px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc2),#7ef0ff);transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);font-size:13px;font-weight:700;border:2px solid transparent;display:flex;align-items:center;gap:6px}
.chipb.sel{border-color:var(--acc2);background:rgba(46,196,182,.16)}
.chipb svg{width:15px;height:15px}
.toggles{display:flex;gap:8px;margin-top:8px}
.tog{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.tog svg{width:17px;height:17px}
.tog.off{opacity:.5}
.go{width:100%;margin-top:16px;padding:16px;border-radius:16px;font-size:22px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#ff9a3c,#ff5e1a);box-shadow:0 8px 24px rgba(255,94,26,.4);transition:transform .1s}
.go:active{transform:scale(.97)}
.go.sec{background:rgba(255,255,255,.08);box-shadow:none;font-size:16px;letter-spacing:1px;padding:13px;margin-top:10px}
.best{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--mut)}
.best b{color:var(--tx);font-variant-numeric:tabular-nums}
.small{max-width:360px;text-align:center}
.small h2{margin:2px 0 4px;font-size:28px;font-weight:900}
.big{font-size:52px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.newbest{display:inline-block;background:linear-gradient(90deg,#ffc83d,#ff9a3c);color:#2a1600;font-weight:900;font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:999px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid div{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 6px;font-size:12px;color:var(--mut)}
.grid b{display:block;font-size:19px;color:var(--tx);font-variant-numeric:tabular-nums}
.pm{display:flex;gap:8px;justify-content:center;margin-top:12px}
@media (orientation:portrait) and (max-height:900px){.menu .sub{display:none}.menu h3{margin:12px 0 7px}}
@media (orientation:landscape) and (max-height:560px){
  .menu .panel{max-width:880px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:22px;padding:14px 18px 16px}
  h1{font-size:30px}
  h3{margin:10px 0 6px}
  .go{margin-top:12px;padding:13px}
  .small{max-width:520px}
  .big{font-size:40px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .menu .sub{display:none}
  .menu h3{margin:8px 0 5px}
  .menu .card{width:70px;padding:5px 3px 4px;font-size:11px}
  #cars .card canvas{width:46px!important;height:57px!important}
  #envs .card canvas{width:60px!important;height:45px!important}
  .menu .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .menu .chips::-webkit-scrollbar{display:none}
  .menu .chipb{padding:7px 10px;font-size:12px;flex:0 0 auto}
  .menu .tog{padding:8px;font-size:12px}
  .menu .best{margin-top:8px}
  .menu .stats{margin-top:6px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="tl">
    <div id="score">0</div>
    <div class="row"><span class="chip"><span id="mult">x1</span><i id="multBar"></i></span><span id="dist">0 m</span></div>
  </div>
  <div class="tr">
    <div class="ibtns">
      <button class="ib" id="hMusic" aria-label="Next song"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="17" cy="16" r="3" fill="#fff"/></svg></button>
      <button class="ib" id="hMute" aria-label="Music on or off"></button>
      <button class="ib" id="hPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    </div>
    <div id="lives"></div>
  </div>
  <div id="toast"></div>
  <div id="hint">Drag anywhere to steer · tap <svg width="16" height="16" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="#ff9a3c"/></svg> to boost</div>
  <button id="boost" aria-label="Boost"><canvas id="boostRing" width="204" height="204"></canvas><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="#fff"/></svg><div id="pips"></div></button>
</div>

<div id="menu" class="screen menu">
  <div class="panel">
    <div>
      <h1>FLUSH<span>RUSH</span></h1>
      <div class="sub">Endless road racer. Dodge traffic, grab stars, don't crash.</div>
      <h3>Vehicle</h3>
      <div id="cars" class="cards"></div>
      <div class="stats" id="carStats"></div>
      <h3>Camera</h3>
      <div class="chips" id="views"><button class="chipb" data-v="3d">Chase cam</button><button class="chipb" data-v="top">Top-down</button></div>
    </div>
    <div>
      <h3>Road</h3>
      <div id="envs" class="cards"></div>
      <h3>Music</h3>
      <div id="tracks" class="chips"></div>
      <div class="toggles"><button class="tog" id="mMusic"></button><button class="tog" id="mSfx"></button></div>
      <div class="best"><span>Best here: <b id="bestHere">0</b></span><span>All-time: <b id="bestAll">0</b></span></div>
      <button class="go" id="go">GO</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel small">
    <h2>Paused</h2>
    <div class="sub" id="pTrack"></div>
    <div class="pm"><button class="tog" id="pMusic"></button><button class="tog" id="pNext">Next song</button><button class="tog" id="pSfx"></button></div>
    <button class="go" id="resume">RESUME</button>
    <button class="go sec" id="restart">Restart</button>
    <button class="go sec" id="pView"></button>
    <button class="go sec" id="toMenu">Change car or road</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="panel small">
    <h2>Game over</h2>
    <div id="nb" class="newbest hidden">NEW BEST!</div>
    <div class="big" id="oScore">0</div>
    <div class="sub" id="oBest"></div>
    <div class="grid">
      <div><b id="oDist">0</b>distance</div>
      <div><b id="oStars">0</b>stars</div>
      <div><b id="oClose">0</b>close calls</div>
      <div><b id="oSmash">0</b>smashes</div>
    </div>
    <button class="go" id="again">AGAIN</button>
    <button class="go sec" id="overMenu">Change car or road</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cv=$('c'),ctx=cv.getContext('2d');
var dark=document.createElement('canvas'),dctx=dark.getContext('2d');
var vig=document.createElement('canvas'),vctx=vig.getContext('2d');
var W=1,H=1,DPR=1,SCALE=1,PY=0;

/* ---------------- utils ---------------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var SEED=1234;
function hash(a,b){var h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^SEED;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
var shC={};
function shade(h,a){var k=h+'|'+a;if(shC[k])return shC[k];var n=h.replace('#','');var c=[0,2,4].map(function(i){var v=parseInt(n.substr(i,2),16);return Math.round(a>0?v+(255-v)*a:v*(1+a));});return shC[k]='rgb('+c.join(',')+')';}
function rgba(h,a){var n=h.replace('#','');return 'rgba('+parseInt(n.substr(0,2),16)+','+parseInt(n.substr(2,2),16)+','+parseInt(n.substr(4,2),16)+','+a+')';}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function frr(c,x,y,w,h,r){rr(c,x,y,w,h,r);c.fill();}
function trap(c,y1,w1,y2,w2){c.beginPath();c.moveTo(-w1/2,y1);c.lineTo(w1/2,y1);c.lineTo(w2/2,y2);c.lineTo(-w2/2,y2);c.closePath();c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill();}
function ell(c,x,y,rx,ry,a){c.beginPath();c.ellipse(x,y,rx,ry,a||0,0,6.2832);c.fill();}
function fmt(n){return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}

/* ---------------- settings ---------------- */
var S={car:0,env:0,track:0,music:true,sfx:true,best:{},bestAll:0,view:'3d'};
try{var sv=JSON.parse(localStorage.getItem('flushrush1')||'null');if(sv)for(var k in sv)S[k]=sv[k];}catch(e){}
function save(){try{localStorage.setItem('flushrush1',JSON.stringify(S));}catch(e){}}

/* ---------------- data ---------------- */
var CARS=[
 {id:'super',name:'Supercar',w:34,l:66,top:1.0,hand:1.0,tough:2,col:'#e63946',desc:'The all-rounder. Quick and grippy.'},
 {id:'f1',name:'Formula',w:36,l:76,top:1.18,hand:1.2,tough:1,col:'#2a6df4',desc:'Fastest of all, but hates leaving the tarmac.'},
 {id:'off',name:'Off-road',w:38,l:66,top:0.9,hand:0.95,tough:3,col:'#f08a24',desc:'Full speed on the dirt. Cut the corners.'},
 {id:'truck',name:'Truck',w:44,l:124,top:0.8,hand:0.78,tough:5,col:'#f2c230',desc:'Shoves cars aside. Only trucks and buses hurt.'},
 {id:'moto',name:'Motorbike',w:16,l:42,top:1.06,hand:1.35,tough:1,col:'#22b573',desc:'Slips through gaps. Close calls score double.'}
];
var TT={sedan:{w:32,l:60,big:0},taxi:{w:32,l:60,big:0},van:{w:34,l:70,big:0},pickup:{w:34,l:66,big:0},truck:{w:42,l:112,big:1},bus:{w:42,l:124,big:1}};
var TCOL=['#e9ecef','#adb5bd','#3d4148','#3a86ff','#8338ec','#ff4d8d','#2ec4b6','#f77f00','#6a994e','#bc4749','#4361ee','#8d6e63'];
function cityA(n){return [-110,-40,40,110][Math.floor(hash(n,77)*4)];}
var ENVS=[
 {id:'desert',name:'Desert',lanes:4,laneW:58,ground:'#e3c18c',patch:'#d6b078',shoulder:'#cfad78',asphalt:'#4e4b52',edge:'#f3efe6',div:'#f3efe6',center:'double',
  mix:{sedan:4,pickup:3,van:1,truck:2},road:function(d,p){return 170*Math.sin(d/3100+p[0])+60*Math.sin(d/1270+p[1]);}},
 {id:'city',name:'City',lanes:4,laneW:56,ground:'#80838c',patch:'#787b84',shoulder:'#d4d5d8',asphalt:'#45474e',edge:'#f1f1f1',div:'#f1f1f1',center:'dash',
  mix:{sedan:4,taxi:2,van:2,bus:1,truck:1},road:function(d){var P=1120,n=Math.floor(d/P),t=d/P-n,a=cityA(n),b=cityA(n+1);return a+(b-a)*smooth((t-0.5)/0.4);}},
 {id:'mountain',name:'Mountain',lanes:2,laneW:64,wall:16,ground:'#79a35b',patch:'#6b934f',shoulder:'#a9a18a',asphalt:'#4a4b50',edge:'#f3f3f3',div:'#f2c94c',center:'dash',
  mix:{sedan:4,van:1,pickup:2,truck:1},road:function(d,p){return 230*Math.sin(d/850+p[0])+75*Math.sin(d/370+p[1]);}},
 {id:'coast',name:'Coast',lanes:3,laneW:60,ground:'#8dbb68',patch:'#80ad5d',shoulder:'#e8d3a2',asphalt:'#4b4c53',edge:'#f3f3f3',div:'#f3f3f3',center:'dash',
  mix:{sedan:4,van:2,pickup:1,bus:1},road:function(d,p){return 180*Math.sin(d/1500+p[0])+70*Math.sin(d/640+p[1]);}},
 {id:'forest',name:'Night Forest',lanes:2,laneW:62,ground:'#2d5732',patch:'#264b2b',shoulder:'#4d5a40',asphalt:'#3f4046',edge:'#e8e8e8',div:'#f2c94c',center:'dash',night:true,
  mix:{sedan:4,pickup:2,van:1,truck:1},road:function(d,p){return 150*Math.sin(d/1150+p[0])+65*Math.sin(d/480+p[1]);}}
];

/* ---------------- vehicle drawing (local coords: front = -y) ---------------- */
function wheel(c,x,y,w,h){c.fillStyle='#17181c';frr(c,x-w/2,y-h/2,w,h,Math.min(w,h)*0.35);}
function bodyGrad(c,w,col){var g=c.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,shade(col,-0.25));g.addColorStop(0.5,shade(col,0.14));g.addColorStop(1,shade(col,-0.25));return g;}
function lights(c,w,l,front,rear){
 c.fillStyle=front||'#fff4c8';frr(c,-w/2+3,-l/2+1,6,3,1.5);frr(c,w/2-9,-l/2+1,6,3,1.5);
 c.fillStyle=rear||'#e0252b';frr(c,-w/2+3,l/2-4,7,3,1.5);frr(c,w/2-10,l/2-4,7,3,1.5);
}
function drawSedan(c,w,l,col){
 var hw=w/2,hl=l/2;

 CARS.forEach(function(car,i){

  var b=document.createElement('button');b.className='card';var cc=mkCanvas(74,56);var x=cc[1];

 if(env.id==='coast'){x.fillStyle='#2b9fd8';x.beginPath();pts.forEach(function(p){x.lineTo(p[0]-rw/2-7,p[1]);});x.lineTo(0,h+4);x.lineTo(0,-4);x.fill();x.strokeStyle='#f0d8a2';x.lineWidth=5;x.beginPath();pts.forEach(function(p){x.lineTo(p[0]-rw/2-4,p[1]);});x.stroke();}

function startGame(){

/* ---------------- resize & loop ---------------- */
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';

 SCALE=Math.min(W/420,H/540);PY=H*(W>H?0.78:0.74);setupCam();
 vig.width=Math.max(2,Math.round(W/2));vig.height=Math.max(2,Math.round(H/2));

}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
var last=performance.now();
function frame(now){

 var dt=Math.min(0.034,Math.max(0,(now-last)/1000));last=now;
 if(state==='play'||state==='menu')update(dt);
 else if(state==='dying'){update(dt*0.3);G.dieT-=dt;if(G.dieT<=0)showOver();}
 render();updateHUD();engineUpdate(dt);
}
resize();newGame(true);buildMenu();syncView();show('menu');
requestAnimationFrame(frame);
window.__flushrush={get G(){return G;},get state(){return state;},start:startGame,S:S};
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
